<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة تفاعل الأكسدة والاختزال</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0f19; font-family: sans-serif; color: white; user-select: none; }
        #controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; z-index: 10;
        }
        button {
            padding: 14px 28px; font-size: 16px; border: none; border-radius: 8px; 
            cursor: pointer; font-weight: bold; color: white; transition: 0.2s;
        }
        #startBtn { background-color: #00cc66; box-shadow: 0 0 15px rgba(0,204,102,0.4); }
        #startBtn:hover { background-color: #00ff80; }
        #resetBtn { background-color: #555; }
        #resetBtn:hover { background-color: #777; }
        
        #explanation {
            position: absolute; top: 20px; width: 100%; text-align: center;
            font-size: 20px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            padding: 0 20px; box-sizing: border-box; line-height: 1.5;
        }
        .status-box {
            position: absolute; top: 100px; display: flex; justify-content: space-around; width: 100%;
            font-size: 16px; font-weight: normal;
        }
        .atom-label {
            background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1); width: 250px; text-align: center;
        }
    </style>
</head>
<body>

    <div id="explanation">تفاعل الأكسدة والاختزال: اضغط على الزر لمشاهدة انتقال الإلكترون!</div>
    
    <div class="status-box">
        <div class="atom-label" id="naLabel">
            <strong style="color: #ffcc00; font-size: 18px;">ذرة صوديوم (Na)</strong><br>
            المدار الخارجي: إلكترون واحد (غير مستقر)
        </div>
        <div class="atom-label" id="clLabel">
            <strong style="color: #00ffcc; font-size: 18px;">ذرة كلور (Cl)</strong><br>
            المدار الخارجي: 7 إلكترونات (تحتاج إلكترون)
        </div>
    </div>

    <div id="controls">
        <button id="startBtn" onclick="startTransfer()">ابدأ انتقال الإلكترون</button>
        <button id="resetBtn" onclick="resetSimulation()">إعادة ضبط</button>
    </div>

    <canvas id="redoxCanvas"></canvas>

    <script>
        const canvas = document.getElementById('redoxCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let animationStage = 0; 
        let electronProgress = 0; 

        // تم إصلاح وتدقيق قيم المدارات والإلكترونات هنا تماماً
        const naAtom = {
            orbits: [50, 80, 110], 
            electronsPerOrbit: [2, 8, 1], 
            color: "#ffcc00"
        };

        const clAtom = {
            orbits: [50, 80, 110], 
            electronsPerOrbit: [2, 8, 7], 
            color: "#00ffcc"
        };

        let naX, naY, clX, clY;
        function updateAtomPositions() {
            naX = canvas.width * 0.3;
            naY = canvas.height * 0.55;
            clX = canvas.width * 0.7;
            clY = canvas.height * 0.55;
        }
        updateAtomPositions();

        let angleOffset = 0;

        function drawAtom(x, y, atom, isNa) {
            // 1. رسم النواة المركزية
            ctx.beginPath();
            ctx.arc(x, y, 30, 0, Math.PI * 2);
            ctx.fillStyle = atom.color + "22"; 
            ctx.strokeStyle = atom.color;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fill();
            
            // كتابة رمز العنصر بوضوح
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            let label = isNa ? (animationStage === 2 ? "Na⁺" : "Na") : (animationStage === 2 ? "Cl⁻" : "Cl");
            ctx.fillText(label, x, y);
            ctx.closePath();

            // 2. رسم خطوط المستويات الدائرية والإلكترونات
            atom.orbits.forEach((orbitRadius, orbitIndex) => {
                ctx.beginPath();
                ctx.arc(x, y, orbitRadius, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.closePath();

                let count = atom.electronsPerOrbit[orbitIndex];
                
                // تعديل المدارات خارجياً عند انتقال الإلكترون
                if (isNa && orbitIndex === 2 && animationStage > 0) count = 0; 
                if (!isNa && orbitIndex === 2 && animationStage === 2) count = 8; 

                for (let i = 0; i < count; i++) {
                    let angle = (i * (Math.PI * 2) / count) + angleOffset * (orbitIndex + 1) * 0.5;
                    let ex = x + Math.cos(angle) * orbitRadius;
                    let ey = y + Math.sin(angle) * orbitRadius;

                    ctx.beginPath();
                    ctx.arc(ex, ey, 5, 0, Math.PI * 2);
                    ctx.fillStyle = isNa ? "#ffaa00" : "#00ffaa";
                    ctx.fill();
                    ctx.closePath();
                }
            });
        }

        function drawTransferringElectron() {
            if (animationStage !== 1) return;

            // نقطة انطلاق الإلكترون من المدار الخارجي للصوديوم
            const startX = naX + naAtom.orbits[2];
            const startY = naY;

            // نقطة وصول الإلكترون إلى المدار الخارجي للكلور
            const endX = clX - clAtom.orbits[2];
            const endY = clY;

            const currentX = startX + (endX - startX) * electronProgress;
            const currentY = startY + (endY - startY) * electronProgress;

            // رسم الإلكترون المهاجر باللون الأحمر المضيء
            ctx.beginPath();
            ctx.arc(currentX, currentY, 7, 0, Math.PI * 2);
            ctx.fillStyle = "#ff3333";
            ctx.fill();
            ctx.closePath();

            // رسم خط مسار انتقال الحركة
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(currentX, currentY);
            ctx.strokeStyle = "rgba(255, 51, 51, 0.4)";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.closePath();

            electronProgress += 0.015;

            if (electronProgress >= 1) {
                animationStage = 2; 
                document.getElementById('explanation').innerHTML = "<span style='color: #00ff80;'>اكتمل التفاعل!</span> حدثت <span style='color:#ffcc00'>أكسدة</span> للصوديوم (فقد إلكترون) و<span style='color:#00ffcc'>اختزال</span> للكلور (كسب إلكترون) وتكونت أيونات مستقرة (Na⁺ Cl⁻)";
                
                document.getElementById('naLabel').innerHTML = "<strong style='color: #ffaa00; font-size: 18px;'>أيون صوديوم موجب (Na⁺)</strong><br>فقد إلكترون المدار الخارجي <br><span style='color: #ff3333; font-weight:bold;'>[عملية أكسدة]</span>";
                document.getElementById('clLabel').innerHTML = "<strong style='color: #00ffaa; font-size: 18px;'>أيون كلور سالب (Cl⁻)</strong><br>استقبل الإلكترون واكتمل مدارة <br><span style='color: #00cc66; font-weight:bold;'>[عملية اختزال]</span>";
            }
        }

        function startTransfer() {
            if (animationStage === 0) {
                animationStage = 1;
                electronProgress = 0;
                document.getElementById('explanation').innerHTML = "شاهد الإلكترون <span style='color: #ff3333; font-weight:bold;'>يغادر مدار الصوديوم الخارجي</span> متجهاً إلى الكلور...";
            }
        }

        function resetSimulation() {
            animationStage = 0;
            electronProgress = 0;
            updateAtomPositions();
            document.getElementById('explanation').innerHTML = "تفاعل الأكسدة والاختزال: اضغط على الزر لمشاهدة انتقال الإلكترون!";
            document.getElementById('naLabel').innerHTML = "<strong style='color: #ffcc00; font-size: 18px;'>ذرة صوديوم (Na)</strong><br>المدار الخارجي: إلكترون واحد (غير مستقر)";
            document.getElementById('clLabel').innerHTML = "<strong style='color: #00ffcc; font-size: 18px;'>ذرة كلور (Cl)</strong><br>المدار الخارجي: 7 إلكترونات (تحتاج إلكترون)";
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            angleOffset += 0.01;

            // رسم الذرات ومستويات الطاقة
            drawAtom(naX, naY, naAtom, true);
            drawAtom(clX, clY, clAtom, false);

            // تحريك الإلكترون
            drawTransferringElectron();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
